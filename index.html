<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Grip Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --yellow: #FFD400;
    --white: #FFFFFF;
    --grey: #1c1c1c;
    --mute: #a8a8a8;
    --orange: #FF8A00;
    --green: #2FBF4F;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--black); color: var(--white); font-family: var(--body); }
  body { min-height: 100vh; -webkit-tap-highlight-color: transparent; }
  .app { max-width: 520px; margin: 0 auto; padding: 16px 18px 28px; display: flex; flex-direction: column; gap: 18px; min-height: 100vh; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 64px; height: 64px; border: 0; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: var(--black); color: var(--yellow); font: 600 11px/1.1 var(--body); text-align: center; cursor: pointer; padding: 0; flex: none; }
  .logo img { width: 100%; height: 100%; object-fit: contain; }

  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .lvl { background: var(--grey); border: 2px solid transparent; border-radius: 14px; color: var(--white); padding: 12px 6px; cursor: pointer; font: 600 15px var(--body); display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 84px; }
  .lvl .dot { width: 16px; height: 16px; border-radius: 50%; }
  .lvl .t { font: 800 30px/1 var(--display); }
  .lvl[aria-pressed="true"] { border-color: var(--yellow); background: #141100; }
  .lvl:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }

  .stage { position: relative; display: grid; place-items: center; margin: 4px auto; width: min(82vw, 340px); aspect-ratio: 1; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { stroke: var(--grey); }
  .prog { stroke: var(--yellow); stroke-linecap: round; transition: stroke-dashoffset .1s linear; }
  .readout { text-align: center; z-index: 1; }
  .big { font: 800 clamp(96px, 30vw, 150px)/0.9 var(--display); font-variant-numeric: tabular-nums; }
  .big small { font-size: .35em; }
  .hint { color: var(--mute); font-size: 15px; margin-top: 8px; }
  .running .prog { stroke: var(--yellow); }
  .low .big { color: var(--yellow); }

  .mic { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; color: var(--mute); min-height: 24px; text-align: center; }
  .mic .pulse { width: 12px; height: 12px; border-radius: 50%; background: var(--mute); flex: none; }
  .mic.on { color: var(--white); }
  .mic.on .pulse { background: var(--yellow); animation: pulse 1.4s ease-in-out infinite; }
  .mic.err { color: var(--yellow); }
  @keyframes pulse { 50% { transform: scale(1.6); opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .mic.on .pulse { animation: none; } .prog { transition: none; } }

  .primary { background: var(--yellow); color: var(--black); border: 0; border-radius: 16px; font: 800 30px var(--display); letter-spacing: .04em; padding: 16px; cursor: pointer; min-height: 64px; width: 100%; }
  .secondary { background: none; color: var(--white); border: 2px solid var(--white); border-radius: 16px; font: 600 16px var(--body); padding: 12px; cursor: pointer; min-height: 48px; width: 100%; }

  .panel { display: none; flex-direction: column; gap: 16px; }
  .panel.show { display: flex; }

  .entry { background: var(--grey); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .entry h2 { font: 800 24px var(--display); margin: 0; }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--yellow); background: none; color: var(--yellow); font: 800 34px var(--display); cursor: pointer; }
  .count { font: 800 96px/1 var(--display); min-width: 120px; text-align: center; font-variant-numeric: tabular-nums; }

  .verdict { border-radius: 18px; padding: 18px; text-align: center; }
  .verdict.pass { background: var(--yellow); color: var(--black); }
  .verdict.miss { background: var(--grey); border: 2px solid var(--white); }
  .verdict .v1 { font: 800 40px/1 var(--display); }
  .verdict .v2 { font-size: 16px; margin-top: 6px; }


  .besttop { text-align: right; }
  .bl { color: var(--mute); font-size: 14px; }
  .bn { font: 800 72px/0.9 var(--display); color: var(--yellow); font-variant-numeric: tabular-nums; }
  .bo { color: var(--mute); font-size: 14px; min-height: 18px; }
  .loghead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .loghead h2 { margin: 8px 0 6px; }
  button.small { background: none; color: var(--yellow); border: 2px solid var(--yellow); border-radius: 999px; padding: 8px 16px; font: 600 15px var(--body); cursor: pointer; min-height: 40px; }
  .ov { position: fixed; inset: 0; background: #000; z-index: 50; display: none; flex-direction: column; align-items: center; gap: 14px; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 18px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .ov.show { display: flex; }
  .ov img.nlogo { width: 120px; max-width: 120px; border-radius: 50%; margin-bottom: 8px; }
  #nameIn { width: 100%; max-width: 420px; background: var(--grey); color: var(--white); border: 2px solid var(--yellow); border-radius: 14px; padding: 16px; font: 800 34px var(--display); text-align: center; }
  .ov img { width: 100%; max-width: 420px; border-radius: 14px; }
  .ov .primary, .ov .secondary { max-width: 420px; }
  .log h2 { font: 800 24px var(--display); margin: 8px 0 6px; }
  .day { color: var(--mute); font-size: 14px; margin: 14px 0 6px; }
  .row { display: flex; align-items: center; gap: 12px; background: var(--grey); border-radius: 12px; padding: 10px 14px; margin-bottom: 6px; }
  .row .d { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .row .r { font: 800 28px/1 var(--display); font-variant-numeric: tabular-nums; }
  .row .g { color: var(--mute); font-size: 15px; }
  .row .tm { margin-left: auto; color: var(--mute); font-size: 15px; }
  .row.pass .r { color: var(--yellow); }
  .empty { color: var(--mute); font-size: 15px; }
  button.mic { background: none; border: 2px solid var(--grey); border-radius: 999px; padding: 10px 18px; font-family: var(--body); cursor: pointer; min-height: 48px; align-self: center; }
  button.mic.err { border-color: var(--yellow); }
  details { background: #262626; border: 2px solid #4a4a4a; border-radius: 18px; overflow: hidden; }
  details[open] { border-color: var(--yellow); }
  summary { list-style: none; display: flex; align-items: center; gap: 12px; cursor: pointer; min-height: 60px; padding: 0 18px; font: 800 26px var(--display); letter-spacing: .02em; color: var(--white); }
  summary::-webkit-details-marker { display: none; }
  summary .gear { color: var(--yellow); flex: none; }
  summary .chev { margin-left: auto; flex: none; transition: transform .2s; }
  details[open] summary { background: var(--yellow); color: var(--black); }
  details[open] summary .gear { color: var(--black); }
  details[open] summary .chev { transform: rotate(180deg); }
  .setbody { padding: 6px 18px 20px; background: #262626; }
  .sethead { font: 800 20px var(--display); color: var(--yellow); margin: 14px 0 0; }
  #clearBtn { color: #ff7a6b; border-color: #ff7a6b; margin-top: 20px; }
  @media (prefers-reduced-motion: reduce) { summary .chev { transition: none; } }
  .targets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
  .targets label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--mute); }
  .targets input { background: var(--black); color: var(--white); border: 2px solid var(--mute); border-radius: 10px; padding: 10px; font: 800 24px var(--display); width: 100%; text-align: center; }
  .tickrow { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #4a4a4a; font-size: 16px; min-height: 52px; }
  .tickrow select { background: var(--black); color: var(--white); border: 2px solid var(--mute); border-radius: 10px; padding: 8px 10px; font: 600 16px var(--body); margin-left: auto; }
  .tickrow input { width: 22px; height: 22px; accent-color: var(--yellow); }
</style>
</head>
<body>
<main class="app" id="app">
  <header>
    <button class="logo" id="logoBtn" aria-label="Association logo" title="Tap to change the logo"></button>
    <div class="besttop" aria-live="polite">
      <div class="bl">Best</div>
      <div class="bn" id="bestNum">–</div>
      <div class="bo" id="bestOf"></div>
    </div>
  </header>
  <input type="file" id="logoFile" accept="image/*" hidden>

  <div class="levels" role="group" aria-label="Belt level">
    <button class="lvl" data-i="0" aria-pressed="true"><span class="dot" style="background:var(--yellow)"></span>Yellow<span class="t" id="tg0">40</span></button>
    <button class="lvl" data-i="1" aria-pressed="false"><span class="dot" style="background:var(--orange)"></span>Orange<span class="t" id="tg1">50</span></button>
    <button class="lvl" data-i="2" aria-pressed="false"><span class="dot" style="background:var(--green)"></span>Green<span class="t" id="tg2">60</span></button>
  </div>

  <section class="panel show" id="pMain">
    <div class="stage" id="stage">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="45" fill="none" stroke-width="5"></circle>
        <circle class="prog" id="prog" cx="50" cy="50" r="45" fill="none" stroke-width="5" stroke-dasharray="282.74" stroke-dashoffset="0"></circle>
      </svg>
      <div class="readout">
        <div class="big" id="big">30<small>s</small></div>
        <div class="hint" id="hint">Clap or say “start”</div>
      </div>
    </div>
    <button class="mic" id="mic" aria-live="polite"><span class="pulse"></span><span id="micText">Tap to turn on voice</span></button>
    <button class="secondary" id="tickQuick" aria-pressed="true">Pace tick: on</button>
    <button class="primary" id="startBtn">START</button>
    <button class="secondary" id="stopBtn" style="display:none">STOP</button>
  </section>

  <section class="panel" id="pResult">
    <div class="verdict" id="verdict"></div>
    <div class="entry">
      <h2>How many grips?</h2>
      <div class="stepper">
        <button id="minus" aria-label="Minus one">−</button>
        <div class="count" id="count">0</div>
        <button id="plus" aria-label="Plus one">+</button>
      </div>
      <div class="hint" id="entryHint">Say your number, or tap + and −</div>
    </div>
    <button class="primary" id="saveBtn">SAVE &amp; AGAIN</button>
  </section>

  <details>
    <summary>
      <svg class="gear" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/></svg>
      Settings
      <svg class="chev" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </summary>
    <div class="setbody">
    <label class="tickrow"><input type="checkbox" id="tickBox"> Pace tick: one quiet tick per grip needed</label>
    <label class="tickrow">Tick volume
      <select id="tickVol"><option value="0">Low</option><option value="1">Medium</option><option value="2">High</option></select>
    </label>
    <label class="tickrow"><input type="checkbox" id="halfBox"> Beep at 15 seconds</label>
    <label class="tickrow">Name
      <input id="nameSet" type="text" maxlength="20" placeholder="Your name" style="margin-left:auto;width:55%;background:var(--black);color:var(--white);border:2px solid var(--mute);border-radius:10px;padding:8px 10px;font:600 16px var(--body)">
    </label>
    <label class="tickrow">Clap sensitivity
      <select id="sens"><option value="0">Low</option><option value="1">Medium</option><option value="2">High</option></select>
    </label>
    <button class="secondary" id="clearBtn">Clear log and best scores</button>
    </div>
  </details>

  <section class="log" aria-label="Attempt log">
    <div class="loghead"><h2>Log</h2><button class="small" id="imgBtn" style="display:none">Save as image</button></div>
    <div id="logList"></div>
  </section>

</main>
<div class="ov" id="nameOv" role="dialog" aria-label="Your name" style="justify-content:center">
  <img class="nlogo" id="nameLogo" alt="">
  <input id="nameIn" type="text" maxlength="20" placeholder="Your name" autocomplete="given-name">
  <button class="primary" id="nameOk">CONTINUE</button>
  <button class="secondary" id="nameSkip">Skip</button>
</div>
<div class="ov" id="ov" role="dialog" aria-label="Log image">
  <img id="ovImg" alt="Grip Timer log">
  <button class="primary" id="ovShare">SHARE OR SAVE</button>
  <button class="secondary" id="ovClose">Close</button>
</div>

  var level = 0, state = 'idle', t0 = 0, tick = null, reps = 0, lastWhole = 31, wakeLock = null;

  // ---------- storage (guarded) ----------
  function load() {
    try {
      var raw = localStorage.getItem('gripTimer.v1');
      if (raw) { var o = JSON.parse(raw); for (var k in o) S[k] = o[k]; }

  }

  var $ = function (id) { return document.getElementById(id); };
  var circ = 2 * Math.PI * 45;

  // ---------- UI helpers ----------
  function renderTargets() {
    for (var i = 0; i < 3; i++) {
      $('tg' + i).textContent = S.targets[i];
    }
  }
  var COLS = ['#FFD400', '#FF8A00', '#2FBF4F'], NAMES = ['Yellow', 'Orange', 'Green'];
  function renderBest() {

    $('bestNum').textContent = v == null ? '–' : v;
    $('bestOf').textContent = NAMES[level] + ' · target ' + S.targets[level];
  }
  function renderLog() {
    var box = $('logList');
    if (!S.log || !S.log.length) { box.innerHTML = '<div class="empty">No attempts yet</div>'; $('imgBtn').style.display = 'none'; return; }
    var out = '', lastDay = '';
    S.log.slice().sort(function (a, b) { return b.t - a.t; }).forEach(function (e) {
      var d = new Date(e.t);
      var day = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      var tm = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      if (day !== lastDay) { out += '<div class="day">' + day + '</div>'; lastDay = day; }
      out += '<div class="row' + (e.r >= e.g ? ' pass' : '') + '"><span class="d" style="background:' + COLS[e.l] + '"></span><span class="r">' + e.r + '</span><span class="g">/ ' + e.g + '</span><span class="tm">' + tm + '</span></div>';

    clearInterval(tick); tick = null;
    state = 'result';
    beep(500, 0.9, 0.35);
    releaseAwake();
    $('app').classList.remove('running');
    $('stage').classList.remove('low');
    reps = 0; $('count').textContent = '0';
    var tgt = S.targets[level];
    $('verdict').className = 'verdict miss';
    $('verdict').innerHTML = '<div class="v1">TIME</div><div class="v2">Target: ' + tgt + ' grips</div>';
    $('entryHint').textContent = 'Say your number, or tap + and −';
    show('result');
    micMsg(listening ? listenLabel() : 'Voice off. Tap to turn on', listening ? 'on' : '');
  }
  function cancel() {
    if (state !== 'running' && state !== 'leadin') return;
    leadTimers.forEach(clearTimeout); leadTimers = [];
    clearInterval(tick); tick = null; state = 'idle';
    releaseAwake();
    $('app').classList.remove('running'); $('stage').classList.remove('low');
    setBig('30'); setProg(1);
    $('startBtn').style.display = 'block'; $('stopBtn').style.display = 'none';
    $('hint').textContent = 'Clap or say “start”';
  }
  function setReps(n) {
    reps = Math.max(0, Math.min(999, n));
    $('count').textContent = reps;
    var tgt = S.targets[level], v = $('verdict');
    if (reps >= tgt) {
      v.className = 'verdict pass';
      v.innerHTML = '<div class="v1">EXERCISE COMPLETE</div><div class="v2">' + reps + ' of ' + tgt + ' grips</div>';
    } else {
      v.className = 'verdict miss';
      v.innerHTML = '<div class="v1">' + (tgt - reps) + ' TO GO</div><div class="v2">' + reps + ' of ' + tgt + ' grips</div>';
    }
  }
  function saveAndReset() {
    S.log.push({ t: Date.now(), l: level, r: reps, g: S.targets[level] });
    if (S.log.length > 500) S.log = S.log.slice(-500);
    if (S.best[level] == null || reps > S.best[level]) S.best[level] = reps;
    save(); renderTargets(); renderBest(); renderLog();
    state = 'idle';
    setBig('30'); setProg(1);
    $('startBtn').style.display = 'block'; $('stopBtn').style.display = 'none';
    $('hint').textContent = 'Clap or say “start”';
    show('main');
    micMsg(listening ? listenLabel() : 'Voice off. Tap to turn on', listening ? 'on' : '');
  }

  // ---------- voice ----------
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false, wantListening = false, handled = '';

  var UNITS = { zero:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10, eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19 };
  var TENS = { twenty:20, thirty:30, forty:40, fourty:40, fifty:50, sixty:60, seventy:70, eighty:80, ninety:90 };
  function parseNumber(text) {
    text = text.toLowerCase();
    var m = text.match(/\d+/);
    if (m) return parseInt(m[0], 10);
    var words = text.split(/[\s-]+/), total = null, i;
    for (i = 0; i < words.length; i++) {
      var w = words[i];
      if (w in TENS) total = (total || 0) + TENS[w];
      else if (w in UNITS) total = (total || 0) + UNITS[w];
    }
    return total;
  }
  var START_RE = /\b(start|begin|go)\b/i;
  var STOP_RE = /\b(stop|cancel)\b/i;

  function onTranscript(text) {
    if (state === 'idle') {
      if (START_RE.test(text)) start();
    } else if (state === 'running' || state === 'leadin') {
      if (STOP_RE.test(text)) cancel();
    } else if (state === 'result') {
      var n = parseNumber(text);
      if (n != null && n <= 999) { setReps(n); $('entryHint').textContent = 'Heard ' + n + '. Wrong? Say it again or use + and −'; }
      else if (/\b(save|done|again)\b/i.test(text)) saveAndReset();
    }
  }

  function buildRec() {
    rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'en-GB';
    rec.onresult = function (e) {
      var i = e.resultIndex;
      var r = e.results[e.results.length - 1];
      var txt = r[0].transcript.trim();
      // Act on interim results for speed; guard against repeat triggers per phrase
      var key = state + '|' + txt;
      if (key === handled) return;
      var before = state;
      onTranscript(txt);
      if (state !== before || (before === 'result' && parseNumber(txt) != null)) handled = key;
      if (r.isFinal) handled = '';
    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        speechOk = false;
        if (soundOn) { micMsg('Listening for a clap', 'on'); }
        else { wantListening = false; listening = false; micMsg('Mic blocked. Allow it in browser settings', 'err'); }
      }
    };
    rec.onend = function () {
      listening = soundOn;
      if (wantListening && speechOk) { setTimeout(function () { try { rec.start(); listening = true; } catch (e) {} }, 150); }
    };
    rec.onstart = function () {
      listening = true; speechOk = true;
      micMsg('Listening', 'on');
    };
  }
  var soundOn = false, speechOk = true, an = null, sStream = null, sBuf = null, sTimer = null;
  var armedAt = 0, lastTrig = 0, base = 0.02;
  var TH = [0.5, 0.3, 0.15];
  function listenLabel() { return (SR && speechOk && rec) ? 'Listening' : 'Listening for a clap'; }
  function startSound() {
    if (soundOn) return Promise.resolve(true);
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.resolve(false);
    return navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }).then(function (stream) {
      sStream = stream;
      var a = audio(); if (!a) return false;
      var src = a.createMediaStreamSource(stream);
      an = a.createAnalyser(); an.fftSize = 1024; src.connect(an);
      sBuf = new Float32Array(an.fftSize);
      armedAt = performance.now() + 1000;
      sTimer = setInterval(checkSound, 30);
      soundOn = true; listening = true;
      return true;
    }).catch(function () { return false; });
  }
  function stopSound() {
    if (sTimer) { clearInterval(sTimer); sTimer = null; }
    if (sStream) { try { sStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} sStream = null; }
    an = null; soundOn = false;
  }
  function checkSound() {
    if (!an) return;
    an.getFloatTimeDomainData(sBuf);
    var peak = 0, i, v;
    for (i = 0; i < sBuf.length; i++) { v = Math.abs(sBuf[i]); if (v > peak) peak = v; }
    var now = performance.now();
    base = base * 0.97 + Math.min(peak, 0.1) * 0.03;
    var th = TH[S.sens == null ? 1 : S.sens];
    if (state === 'idle' && now > armedAt && now - lastTrig > 2000 && peak > th && peak > base * 4) {
      lastTrig = now; start();
    }
  }
  function startListening() {
    wantListening = true;
    micMsg('Starting', '');
    startSound().then(function (ok) {
      if (SR) {
        if (!rec) buildRec();
        try { rec.start(); } catch (e) {}
        if (ok) micMsg(listenLabel(), 'on');
      } else if (ok) {
        micMsg('Listening for a clap', 'on');
      } else {
        wantListening = false;
        micMsg('Mic blocked. Allow it in browser settings', 'err');
      }
    });
  }
  function stopListening() {
    wantListening = false;
    if (rec) { try { rec.stop(); } catch (e) {} }
    stopSound();
    listening = false;
    micMsg('Voice off. Tap to turn on', '');
  }

  // ---------- events ----------
  var lv = document.querySelectorAll('.lvl');
  lv.forEach(function (b) {
    b.addEventListener('click', function () {
      if (state === 'running' || state === 'leadin') return;
      level = +b.dataset.i; renderBest();
      lv.forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      if (state === 'result') setReps(reps);
    });
  });
  $('startBtn').addEventListener('click', function () {
    audio();
    if (!wantListening) startListening();
    start();
  });
  $('stopBtn').addEventListener('click', cancel);
  $('mic').addEventListener('click', function () { audio(); if (wantListening) stopListening(); else startListening(); });
  $('plus').addEventListener('click', function () { setReps(reps + 1); });
  $('minus').addEventListener('click', function () { setReps(reps - 1); });
  $('saveBtn').addEventListener('click', saveAndReset);
  function syncTick() {
    $('tickBox').checked = S.tick !== false;
    $('tickQuick').textContent = 'Pace tick: ' + (S.tick !== false ? 'on' : 'off');
    $('tickQuick').setAttribute('aria-pressed', S.tick !== false ? 'true' : 'false');
  }
  syncTick();
  $('tickVol').value = String(S.tickVol == null ? 1 : S.tickVol);
  $('tickVol').addEventListener('change', function () {
    S.tickVol = parseInt($('tickVol').value, 10); save();
    audio(); beep(1500, 0.03, TV[S.tickVol], 'sine');
    setTimeout(function () { beep(1500, 0.03, TV[S.tickVol], 'sine'); }, 500);
  });
  $('halfBox').checked = S.half !== false;
  $('halfBox').addEventListener('change', function () { S.half = $('halfBox').checked; save(); });
  $('sens').value = String(S.sens == null ? 1 : S.sens);
  $('sens').addEventListener('change', function () { S.sens = parseInt($('sens').value, 10); save(); });
  $('tickBox').addEventListener('change', function () { S.tick = $('tickBox').checked; save(); syncTick(); });
  $('tickQuick').addEventListener('click', function () { S.tick = !(S.tick !== false); save(); syncTick(); });
  $('logoBtn').addEventListener('click', function () { $('logoFile').click(); });
  $('logoFile').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { S.logo = rd.result; save(); renderLogo(); };
    rd.readAsDataURL(f);
  });
  // First tap anywhere switches the mic on (browsers require a tap)
  function firstTap(e) {
    if (e.target && e.target.closest && e.target.closest('#mic')) return;
    if ($('nameOv').classList.contains('show')) return;
    document.removeEventListener('pointerdown', firstTap);
    audio();
    if (!wantListening && !listening) startListening();
  }
  document.addEventListener('pointerdown', firstTap);


  // ---------- clear log ----------
  var clearArmed = false, clearTimer = null;
  function resetClear() { clearArmed = false; clearTimeout(clearTimer); $('clearBtn').textContent = 'Clear log and best scores'; }
  $('clearBtn').addEventListener('click', function () {
    if (!clearArmed) {
      clearArmed = true;
      $('clearBtn').textContent = 'Tap again to clear everything';
      clearTimer = setTimeout(resetClear, 4000);
      return;
    }
    resetClear();
    S.log = []; S.best = [null, null, null]; S.name = ''; S.asked = false; save(); renderBest(); renderLog();
    $('nameSet').value = ''; showName();
  });

  // ---------- log as image ----------
  var imgFile = null;
  function loadImg(src) {
    return new Promise(function (res) { var i = new Image(); i.onload = function () { res(i); }; i.onerror = function () { res(null); }; i.src = src; });
  }
  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function fitFont(g, text, weight, family, size, maxW) {
    do { g.font = weight + ' ' + size + 'px ' + family; size -= 4; } while (g.measureText(text).width > maxW && size > 16);
  }
  function feedback(top) {
    var nm = (S.name || '').trim().toUpperCase(), tail = nm ? ', ' + nm : '';
    var pct = top.r / top.g, gap = top.g - top.r, belt = NAMES[top.l].toLowerCase();
    var older = S.log.filter(function (e) { return e.l === top.l && e.t < top.t; }).sort(function (a, b) { return b.t - a.t; });
    var line3 = [];
    if (older.length && top.r > Math.max.apply(null, older.map(function (e) { return e.r; }))) line3.push('New best.');
    if (older.length) {
      var d = top.r - older[0].r;
      if (d > 0) line3.push('+' + d + ' on your last attempt.');
      else if (d === 0) line3.push('Same as your last attempt.');
    }
    var t, sub;
    if (pct >= 1) { t = 'CONGRATULATIONS' + tail; sub = top.r + ' of ' + top.g + ' grips. ' + NAMES[top.l] + ' gripping exercise completed.'; }
    else if (pct >= 0.9) { t = 'SO CLOSE' + tail; sub = top.r + ' of ' + top.g + ' grips. ' + gap + ' more to complete the ' + belt + ' gripping exercise.'; }
    else if (pct >= 0.75) { t = 'NEARLY THERE' + tail; sub = top.r + ' of ' + top.g + ' grips. ' + gap + ' to go. Keep going.'; }
    else if (pct >= 0.5) { t = 'GOOD PROGRESS' + tail; sub = top.r + ' of ' + top.g + ' grips. Every session builds speed.'; }
    else { t = 'KEEP PRACTISING' + tail; sub = top.r + ' of ' + top.g + ' grips. Speed comes with repetition.'; }
    return { title: t, sub: sub, extra: line3.join(' ') };
  }
  async function makeImage() {
    try { await document.fonts.load('800 80px "Barlow Condensed"'); await document.fonts.load('600 30px "Barlow"'); } catch (e) {}
    var DISP = '"Barlow Condensed", "Arial Narrow", Impact, sans-serif', BODY = 'Barlow, system-ui, Arial, sans-serif';
    var rows = S.log.slice().sort(function (a, b) { return b.t - a.t; }).slice(0, 10);
    var fb = feedback(rows[0]);
    var W = 1080, H = 820 + rows.length * 96 + 50;
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var g = c.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#FFD400'; g.fillRect(0, 0, W, 18);

    var logo = await loadImg(S.logo || DEFAULT_LOGO);
    if (logo) { g.save(); g.beginPath(); g.arc(130, 160, 90, 0, Math.PI * 2); g.clip(); g.drawImage(logo, 40, 70, 180, 180); g.restore(); }
    g.textBaseline = 'alphabetic';
    var nm = (S.name || '').trim(), head = nm ? nm.toUpperCase() : 'GRIP TIMER';
    g.fillStyle = '#fff'; fitFont(g, head, '800', DISP, 96, 780); g.fillText(head, 250, 160);
    var last = new Date(rows[0].t);
    g.fillStyle = '#a8a8a8'; g.font = '600 32px ' + BODY;
    g.fillText(last.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + '  ·  ' + S.log.length + ' attempts', 250, 214);

    // feedback banner
    g.fillStyle = '#FFD400'; rr(g, 40, 280, 1000, 200, 28); g.fill();
    g.fillStyle = '#000'; fitFont(g, fb.title, '800', DISP, 64, 940); g.fillText(fb.title, 72, 352);
    fitFont(g, fb.sub, '600', BODY, 34, 940); g.fillText(fb.sub, 72, 408);
    if (fb.extra) { fitFont(g, fb.extra, '600', BODY, 30, 940); g.fillText(fb.extra, 72, 454); }

    // best per belt
    var i, x;
    for (i = 0; i < 3; i++) {
      x = 40 + i * 343;
      g.fillStyle = '#1c1c1c'; rr(g, x, 510, 314, 210, 24); g.fill();
      g.fillStyle = COLS[i]; g.beginPath(); g.arc(x + 40, 555, 14, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#fff'; g.font = '600 34px ' + BODY; g.fillText(NAMES[i], x + 66, 566);
      g.fillStyle = S.best[i] != null && S.best[i] >= S.targets[i] ? '#FFD400' : '#fff';
      var bs = S.best[i] == null ? '–' : String(S.best[i]);
      g.font = '800 120px ' + DISP; g.fillText(bs, x + 28, 680);
      var bw = g.measureText(bs).width;
      g.fillStyle = '#a8a8a8'; g.font = '600 30px ' + BODY; g.fillText('/ ' + S.targets[i], x + 28 + bw + 14, 680);
    }

    // attempts
    g.fillStyle = '#fff'; g.font = '800 48px ' + DISP; g.fillText('LOG', 40, 785);
    rows.forEach(function (e, n) {
      var y = 810 + n * 96, pass = e.r >= e.g;
      g.fillStyle = '#1c1c1c'; rr(g, 40, y, 1000, 84, 20); g.fill();
      g.fillStyle = COLS[e.l]; g.beginPath(); g.arc(80, y + 42, 14, 0, Math.PI * 2); g.fill();
      g.fillStyle = pass ? '#FFD400' : '#fff'; g.font = '800 62px ' + DISP; g.fillText(String(e.r), 116, y + 62);
      var rw = g.measureText(String(e.r)).width;
      g.fillStyle = '#a8a8a8'; g.font = '600 32px ' + BODY; g.fillText('/ ' + e.g, 116 + rw + 12, y + 56);
      var d = new Date(e.t);
      var txt = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      g.textAlign = 'right'; g.fillText(txt, 1010, y + 56); g.textAlign = 'left';
    });
    return new Promise(function (res) { c.toBlob(function (b) { res(b); }, 'image/png'); });
  }
  $('imgBtn').addEventListener('click', async function () {
    if (!S.log.length) return;
    var blob = await makeImage();
    if (!blob) return;
    imgFile = new File([blob], 'grip-timer-log.png', { type: 'image/png' });
    $('ovImg').src = URL.createObjectURL(blob);
    $('ov').classList.add('show');
  });
  $('ovClose').addEventListener('click', function () { $('ov').classList.remove('show'); });
  $('ovShare').addEventListener('click', function () {
    if (!imgFile) return;
    if (navigator.canShare && navigator.canShare({ files: [imgFile] })) {
      navigator.share({ files: [imgFile] }).catch(function () {});
    } else {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(imgFile); a.download = 'grip-timer-log.png';
      document.body.appendChild(a); a.click(); a.remove();
    }
  });

  // ---------- name ----------
  function showName() {
    $('nameIn').value = S.name || '';
    $('nameOv').classList.add('show');
    setTimeout(function () { try { $('nameIn').focus(); } catch (e) {} }, 150);
  }
  function closeName(keep) {
    S.name = keep ? $('nameIn').value.trim().slice(0, 20) : '';
    S.asked = true; save();
    $('nameSet').value = S.name;
    $('nameOv').classList.remove('show');
  }
  $('nameOk').addEventListener('click', function () { closeName(true); });
  $('nameSkip').addEventListener('click', function () { closeName(false); });
  $('nameIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') closeName(true); });
  $('nameSet').addEventListener('change', function () { S.name = $('nameSet').value.trim().slice(0, 20); S.asked = true; save(); });

  // ---------- init ----------
  if (!S.log) S.log = [];
  $('nameLogo').src = S.logo || DEFAULT_LOGO; $('nameSet').value = S.name || '';
  if (!S.asked) showName();
  renderTargets(); renderLogo(); renderBest(); renderLog(); setProg(1);
  if (!SR) micMsg('Voice not supported here', 'err');
  else micMsg('Tap to turn on voice', '');
})();
</script>
</body>
